<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOOL002 기관별 누적검사기</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:20px}section{border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}input{font-size:16px;padding:10px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px}.pass{color:#176b38}.hold{color:#9a5b00}</style></head><body><h1>TOOL002 기관별 누적검사기</h1><section><label>나라장터 XLSX <input id="fileInput" type="file" accept=".xlsx,.xls"></label><p id="status" class="hold">HOLD — 파일을 선택하세요.</p></section><section>헤더 행: <strong id="headerRow">-</strong> / 중복 제거 공고: <strong id="rowCount">-</strong> / 기관 수: <strong id="institutionCount">-</strong></section><section><table><thead><tr><th>기관</th><th>누적 공고</th></tr></thead><tbody id="resultBody"></tbody></table></section><script>
const el=id=>document.getElementById(id);let activeWorker=null;el('fileInput').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;if(activeWorker)activeWorker.terminate();el('status').textContent='작업중 — 별도 worker에서 XLSX 처리';const worker=activeWorker=new Worker('./src/tool002-xlsx-worker.js');worker.onmessage=message=>{const payload=message.data;if(!payload.ok){window.__TOOL002_LAST_RESULT__={status:'HOLD_RUNTIME_ERROR',error:payload.error};el('status').textContent='HOLD_RUNTIME_ERROR: '+payload.error;return}const result=payload.result;window.__TOOL002_LAST_RESULT__=result;el('headerRow').textContent=result.headerRow??'-';el('rowCount').textContent=result.rows.length;el('institutionCount').textContent=result.institutions.length;el('resultBody').replaceChildren(...result.institutions.map(item=>{const tr=document.createElement('tr'),name=document.createElement('td'),count=document.createElement('td');name.textContent=item.institution;count.textContent=item.count;tr.append(name,count);return tr}));el('status').textContent=result.status;el('status').className=result.status==='PASS'?'pass':'hold';worker.terminate();activeWorker=null};worker.onerror=error=>{window.__TOOL002_LAST_RESULT__={status:'HOLD_WORKER_ERROR',error:error.message};el('status').textContent='HOLD_WORKER_ERROR: '+error.message};const buffer=await file.arrayBuffer();worker.postMessage(buffer,[buffer]);});
</script></body></html>
